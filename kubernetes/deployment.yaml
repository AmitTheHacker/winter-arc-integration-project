apiVersion: apps/v1
kind: Deployment
metadata:
  name: revision-app
  namespace: day34-revision
spec:
  replicas: 2
  selector:
    matchLabels:
      app: revision-app
  template:
    metadata:
      labels:
        app: revision-app
    spec:
      containers:
        - name: app
          image: winter-arc-app:v1.0.0 # Replace with your Day 32 image tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080 # Replace with your actual APP_PORT
          envFrom:
            - configMapRef:
                name: revision-app-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

